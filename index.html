<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PrepMate - AI Preparation</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        .container {
            padding: 80px 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 35px;
        }

        button {
            padding: 15px 30px;
            font-size: 17px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>PrepMate</h1>

        <p>
            Your AI-powered partner for Viva, Presentation and Interview Preparation.
        </p>

        <button onclick="startPreparation()">
            Start Preparation
        </button>

    </div>

    <script>
        function startPreparation() {
            alert("Welcome to PrepMate! Your preparation starts here.");
        }
    </script>

</body>
</html>
